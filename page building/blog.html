<!-- 
  [Legacy URL Redirect Manager]
  Role: Permanently forwards legacy /blog.html requests to Stats Lab (statslab.html) or Gallery (gallery.html).
  NOTE: This file is fully automated. You DO NOT need to edit this file when adding new posts.
        Manage all posts exclusively in statslab.html!
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=statslab.html">
    <title>Redirecting to Stats Lab...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fbfbfa;
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .redirect-box {
            background: white;
            border: 1px solid rgba(15, 23, 42, 0.08);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.01);
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            color: #ea580c;
        }

        a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        let targetUrl = 'statslab.html';
        (function() {
            // Get URL Hash (e.g. #fe_be_re, #did_tutorial)
            let hash = window.location.hash.replace('#', '').trim();
            
            // 1. Legacy non-StatsLab redirects
            if (hash === 'opportunity_insights') {
                targetUrl = 'blog/studynotes/chetty.html';
            } else if (hash.startsWith('map_art_') || hash === 'seoul_life_exp_skin') {
                targetUrl = 'gallery.html';
            } else if (hash) {
                // 2. Normalization for legacy aliases
                if (hash === 'control') hash = 'what_is_control';
                if (hash === 'understanding_meta_analysis') hash = 'understanding-meta-analysis';

                // 3. Fully dynamic forward: automatically routes any current or future post hash!
                targetUrl = 'statslab.html#' + hash;
            }

            // Perform instant redirect
            window.location.replace(targetUrl);
        })();
    </script>
</head>

<body>
    <div class="redirect-box">
        <h2>Page Moved</h2>
        <p>This content has moved to the new Stats Lab page.</p>
        <p>You are being redirected automatically. If you are not redirected, <a href="statslab.html" id="fallback-link">click here to proceed</a>.</p>
    </div>
    <script>
        if (targetUrl) {
            document.getElementById('fallback-link').href = targetUrl;
        }
    </script>
</body>

</html>
